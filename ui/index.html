<!doctype html>
<html lang="en" data-theme="graphite">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="description" content="AGENCY OS — the command deck of the agency: roster, board, review, bus, records.">
<title>AGENCY OS · command deck</title>
<link rel="icon" href="/assets/mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="app">
  <header class="topbar" id="topbar" role="banner"></header>

  <div class="workspace">
    <aside class="rail" id="rail" aria-label="Panels"></aside>
    <main class="desk" id="desk">
      <div class="desk-empty" id="stage">
        <div class="big">ESTABLISHING CONTROL</div>
        <div>the deck is reading the agency's own repositories</div>
      </div>
    </main>
    <aside class="watch" id="watch" aria-label="Surveillance"></aside>
  </div>

  <footer class="taskbar" id="taskbar" role="contentinfo"></footer>
</div>

<div class="boot" id="boot" data-done="false" role="status" aria-live="polite">
  <div class="boot-mark" id="boot-mark">
    <svg viewBox="0 0 32 32" width="54" height="54" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true">
      <path d="M16 2.5 29 9.5v13L16 29.5 3 22.5v-13z" opacity=".5"/>
      <path d="M16 8.2 24 12.6v8.8L16 25.8 8 21.4v-8.8z"/>
      <circle cx="16" cy="17" r="3.1" fill="currentColor" stroke="none"/>
      <path d="M16 3v5.2M16 23.8V29M3.6 9.9 8 12.3M24 21.7l4.4 2.4" opacity=".45"/>
    </svg>
  </div>
  <div class="boot-title">AGENCY OS</div>
  <div class="boot-line"><i></i></div>
  <div class="boot-sub" id="boot-step">establishing control…</div>
</div>

<noscript>
  <div style="position:fixed;inset:0;display:grid;place-items:center;background:#090b0d;color:#e7ecef;font-family:sans-serif;text-align:center;padding:24px">
    <div>
      <h1 style="letter-spacing:.2em">AGENCY OS</h1>
      <p>The deck is a single-page interface and needs JavaScript. The data it shows is served by
      <code>agencyd</code>; nothing is loaded from a third-party CDN.</p>
    </div>
  </div>
</noscript>

<script type="module" src="/js/app.js"></script>

</body>
</html>
